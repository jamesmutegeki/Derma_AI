name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dermatology-ai
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dermatology-ai/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Tests need the pure-python stack; torch is only used by the
          # transform-parity and eval-script tests, so install the CPU wheel.
          pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Guard against fabricated claims and default credentials
        run: bash scripts/ci_grep.sh

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Run the test suite
        # Run from the repository root: the S1 tests exercise run_evaluation_*.py.
        working-directory: .
        run: python -m pytest dermatology-ai/tests -q

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dermatology-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.3
      - name: Fatal lint errors only (undefined names, syntax)
        run: ruff check . --select E9,F63,F7,F82 --exclude tests
