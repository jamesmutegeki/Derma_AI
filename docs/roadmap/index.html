nvironment and record hardware, seeds, and package versions.","Use permitted cloud GPU data only; keep restricted PASSION/local data on approved storage.","Reserve space for datasets, checkpoints, logs, and backups outside Git."],"done_when":["A new environment reproduces the smoke run.","Checkpoint and report storage paths are configured and backed up."],"evidence":["Requirements are lower-bounded rather than locked; the notebook hardcodes CPU and legacy local paths."],"artifacts":["requirements lock","dermatology-ai/docs/TRAINING.md"]}]},{"id":"P2","station":"Concept Ridge","name":"Make explanations meaningful","window":"Weeks 2–4","status":"blocked","depends_on":["P1.1","P1.3"],"outcome":"The seven bottleneck outputs correspond to defined, reviewable visual evidence rather than arbitrary hidden units.","why":"A layer named concept is not interpretable merely because it has seven outputs.","tasks":[{"id":"P2.1","title":"Agree the concept dictionary","status":"todo","priority":"P0","owner":"Dermatologist + research lead","effort":"M","how":["Define each concept, positive/negative examples, visibility rules, and whether it is observable without scale or patient history.","Review diameter_large and melanin_density carefully; do not treat image pigment as a validated Fitzpatrick label."],"done_when":["A clinician-reviewed dictionary exists.","Unobservable concepts are removed, reframed, or explicitly marked as limitations."],"evidence":["The model defines seven names, but the current training loss supervises class labels only."],"artifacts":["dermatology-ai/docs/CONCEPT_DICTIONARY.md"]},{"id":"P2.2","title":"Acquire concept supervision","status":"blocked","priority":"P0","owner":"Dermatologist annotators","effort":"L","how":["Map SKINCON annotations only where definitions genuinely match; ulcer and erythema are candidates, not automatic equivalents.","Have clinicians label missing concepts and resolve disagreements on a double-annotated subset.","Keep missing labels m "blocked","depends_on":["P0.1","P1.2","P1.3","P1.4","P2.1","P2.2"],"outcome":"A baseline, CBM candidate, and triage policy are trained from documented real data with reproducible artifacts.","why":"Training is not done when a loop finishes; it is done when the run can be trusted and repeated.","tasks":[{"id":"P3.1","title":"Repair the training entry point","status":"partial","priority":"P0","owner":"ML engineer","effort":"M","how":["Replace hardcoded paths with configuration, add the real KS source resolver, and select CPU/GPU explicitly.","Prevent PASSION evaluation data and synthetic KS from entering a real-data training claim.","Run a tiny smoke batch before any long run."],"done_when":["The smoke run works from a clean environment.","The resolved manifest contains only permitted training sources."],"evidence":["MultiSourceDermDataset has no Kaposi cohort source and the notebook retains legacy path/domain assumptions."],"artifacts":["dermatology-ai/notebooks/01_train_cbm.py","dermatology-ai/datasetEquity.py"]},{"id":"P3.2","title":"Train the standard baseline","status":"todo","priority":"P1","owner":"ML engineer","effort":"M","how":["Train a standard transfer-learning classifier on the same locked splits and preprocessing budget.","Select hyperparameters using validation data only and save the run configuration."],"done_when":["A baseline checkpoint and validation report exist.","The comparison protocol is fixed before viewing test results."],"evidence":["No validated baseline run is recorded."],"artifacts":["baseline run directory outside Git"]},{"id":"P3.3","title":"Train the concept-supervised CBM","status":"blocked","priority":"P0","owner":"ML engineer","effort":"L","how":["Train on the audited real cohort with masked concept supervision and class imbalance handling.","Track validation performance, calibration, concept coverage, and subgroup counts; use early stopping.","Save candidate checkpoints externally with data/config/code hashes."],"done_when":["A can ion with uncertainty, subgroup detail, and negative results preserved.","why":"Accuracy alone can hide critical misses, calibration failures, and unequal performance.","tasks":[{"id":"P4.1","title":"Evaluate diagnosis on sealed real test data","status":"todo","priority":"P0","owner":"ML engineer","effort":"M","how":["Report per-class sensitivity/specificity, balanced accuracy, AUROC/AUPRC where valid, calibration, and confidence intervals.","State sample sizes and undefined metrics instead of filling zeros.","Evaluate each frozen candidate once under the locked protocol."],"done_when":["A machine-readable report and human-readable summary are saved with the checkpoint hash.","No metrics are invented or copied from unrelated benchmarks."],"evidence":["No validated real-data metrics exist."],"artifacts":["evaluation report","predictions manifest"]},{"id":"P4.2","title":"Audit fairness with uncertainty","status":"todo","priority":"P0","owner":"ML + clinician","effort":"L","how":["Report triage TPR/FNR and gaps by verified skin-tone group with counts and confidence intervals.","Pre-specify acceptable trade-offs with clinicians; do not invent passing thresholds after seeing results.","Explain why demographic parity may be inappropriate when disease prevalence differs."],"done_when":["Small/missing strata are flagged.","Reward weighting is compared with an unweighted baseline.","Conclusions distinguish observed gaps from statistical certainty."],"evidence":["Fairness code exists, but no real evaluation output is recorded."],"artifacts":["fairness report","dermatology-ai/metrics_tracker.py"]},{"id":"P4.3","title":"Repair and run external PASSION monitoring","status":"partial","priority":"P0","owner":"ML engineer","effort":"M","how":["Use the actual triage policy for lanes; do not treat diagnosis class index 2 as the urgent lane.","Aggregate by subject, preserve original conditions, clean temporary files, and use deterministic preprocessing.","Report escalation distributions only, not diagnostic accuracy against unrelated inflammatory labels."],"done_when":["The evaluator consumes the frozen CBM and triage artifacts.","Subject-level outputs reconcile to the local subset manifest.","The report states subset and missing-Fitzpatrick limitations."],"evidence":["PASSION helpers and 15 tests are tracked/reportedly passing; the evaluation script still conflates class predictions with triage lanes."],"artifacts":["run_evaluation_passion.py","dermatology-ai/scripts/passion_metrics.py"]},{"id":"P4.4","title":"Evaluate concepts and explanations","status":"todo","priority":"P1","owner":"Clinician + ML engineer","effort":"M","how":["Measure concept agreement on held-out expert labels and the effect of correct concept interventions.","Run attribution sanity checks and collect structured clinician ratings on a blinded sample.","Report disagreement and unobservable concepts."],"done_when":["Concept utility is compared with the class-only baseline.","Explanation claims are bounded by the measured evidence."],"evidence":["No concept-consistency or clinician explanation-agreement results are recorded."],"artifacts":["concept evaluation report"]},{"id":"P4.5","title":"Run the research ablations","status":"todo","priority":"P1","owner":"Research lead","effort":"L","how":["Compare baseline, CBM, CBM plus fairness-weighted triage, and reviewed offline feedback under matched conditions.","Simulate low-label and low-bandwidth constraints explicitly rather than assuming them.","Use repeated seeds or appropriate uncertainty estimates and preserve negative results."],"done_when":["Each claimed contribution has a comparison or is downgraded to future work.","The report separates simulated HITL evidence from real clinician evidence."],"evidence":["The proposal claims low-label/low-bandwidth and HITL benefits without completed comparisons."],"artifacts":["ablation matrix","research results report"]}]},{"id":"P5","station":"Clinical Review Camp","name":"Make the human loop safe","window":"Weeks 7–9","status":"partial","depends_on":["P0.1","P3.5"],"outcome":"A research dashboard can be reviewed safely, with honest fallbacks, traceable feedback, and no autonomous clinical use.","why":"A clinician button does not make an unvalidated update safe.","tasks":[{"id":"P5.1","title":"Make backend readiness and fallbacks honest","status":"failed","priority":"P0","owner":"Backend engineer","effort":"M","how":["Remove silent fixed-payload diagnosis from the authenticated inference path; return an explicit unavailable state.","Load only the declared checkpoint and expose /api/ready with model/data provenance.","Keep demo payloads in a clearly labelled demo route or fixture."],"done_when":["No random/pretrained-only model is presented as trained.","Unavailable backend never returns a plausible fabricated diagnosis.","Contract tests cover ready, unauthenticated, and unavailable states."],"evidence":["_fallback_diagnosis returns a fixed melanoma/follow-up payload; /api/ready is absent at the snapshot."],"artifacts":["dermatology-ai/server.py","API contract tests"]},{"id":"P5.2","title":"Validate offline HITL updates","status":"partial","priority":"P0","owner":"ML + clinician","effort":"L","how":["Audit PPO importance ratios, stored log-probabilities, reward ground truth, and selection bias from overrides-only data.","Require reviewed corrections, versioned updates, shadow evaluation, and rollback before activation.","Keep concept corrections distinct from diagnosis and triage corrections."],"done_when":["Update tests prove old/new policy quantities are handled correctly.","A bad update can be rejected or rolled back.","No live patient-driven learning occurs without approval."],"evidence":["HITL buffer and optimizer exist; the offline path recomputes log-probabilities with the current network and lacks a validated promotion gate."],"artifacts":["dermatology-ai/hitl_pipeline.py","HITL validation report"]},{"id":"P5.3","title":"Run a synthetic clinician review session","status":"todo","priority":"P1","owner":"Research lead + clinician","effort":"M","how":["Use clearly labelled synthetic cases and a written session script.","Measure agreement, override reasons, review time, and explanation usefulness.","Obtain any required ethics determination for human participants before recruitment."],"done_when":["Session notes and structured results are saved without patient data.","Findings feed a prioritized UI/HITL change list."],"evidence":["No completed clinician review session is recorded."],"artifacts":["usability protocol","session report"]},{"id":"P5.4","title":"Verify privacy, security, and recovery","status":"partial","priority":"P0","owner":"Backend engineer","effort":"L","how":["Test authentication, CSRF, rate limits, upload validation, access control, audit logs, and PII protection.","Implement and test the actual backup/restore path used by the app.","Never log raw images or secrets; define retention and deletion drills."],"done_when":["Security and restore tests pass in CI.","The runbook matches the implemented storage system.","Sensitive runtime data remain outside Git."],"evidence":["Several hardening changes exist, but the declared SQLite backup modules are missing and full integration coverage is unverified."],"artifacts":["dermatology-ai/SECURITY.md","dermatology-ai/docs/OPERATIONS.md","integration tests"]},{"id":"P5.5","title":"Deploy a bounded research demo","status":"todo","priority":"P2","owner":"Backend + frontend","effort":"M","how":["Deploy with research-only banner, explicit model status, restricted access, health/readiness telemetry, and synthetic/demo separation.","Use relative browser URLs and approved environment configuration.","Keep real inference disabled until the safety and ethics gates pass."],"done_when":["A reviewer can exercise the intended workflow without mistaking demo output for diagnosis.","Logs and rollback steps are documented."],"evidence":["Deployment configuration exists, but a verified safe research deployment is not recorded."],"artifacts":["dermatology-ai/render.yaml","deployment checklist"]}]},{"id":"P6","station":"Research Summit","name":"Package evidence and decide","window":"Weeks 9–10","status":"todo","depends_on":["P4.1","P4.2","P4.3","P4.5","P5.3"],"outcome":"A reproducible academic package states what worked, what failed, and what is still not safe to claim.","why":"The finish line is defensible evidence, not a green badge or a polished poster alone.","tasks":[{"id":"P6.1","title":"Write the evidence-led results report","status":"todo","priority":"P0","owner":"Research lead","effort":"L","how":["Structure around research questions, methods, sealed-test results, fairness, ablations, limitations, and negative findings.","Link every number to a run, checkpoint, data version, and script.","Keep clinical validation and regulatory clearance out of claims."],"done_when":["A reviewer can trace every result to evidence.","Unsupported novelty/performance statements are removed."],"evidence":["No validated results report exists."],"artifacts":["docs/reports/","dermatology-ai/MODEL_CARD.md"]},{"id":"P6.2","title":"Package poster, demo, and reproduction guide","status":"partial","priority":"P1","owner":"Project lead","effort":"M","how":["Update poster/slides from the final report, not legacy placeholders.","Provide one-command environment/test/evaluation instructions and artifact hashes.","Include a failure/limitations panel in the poster and demo."],"done_when":["A fresh reviewer reproduces the headline table and demo walkthrough.","All document links resolve."],"evidence":["Poster, slides, and report scaffolds exist; final evidence is absent."],"artifacts":["dermatology-ai/poster.html","dermatology-ai/slides.html","README.md"]},{"id":"P6.3","title":"Hold supervisor and stakeholder review","status":"blocked","priority":"P1","owner":"Supervisor + UCI/Mbarara reviewers","effort":"M","how":["Present the evidence package, limitations, and safety boundary.","Record requested changes and whether the academic prototype is accepted.","Do not treat prototype acceptance as pilot authorization."],"done_when":["Written review notes and next-step decision exist.","Open safety/ethics issues have named owners."],"evidence":["Stakeholder alignment remains an external dependency in the project roadmap."],"artifacts":["stakeholder review notes"]},{"id":"P6.4","title":"Make a separate pilot decision","status":"blocked","priority":"P2","owner":"Institution + clinical partners","effort":"L","how":["Require a separate protocol, ethics/regulatory review, monitoring plan, stop rules, training, and incident response.","Use shadow mode before any influence on care.","Keep this outside the current academic completion claim unless separately approved."],"done_when":["All institutional requirements are satisfied in writing.","The system remains research-only until that decision explicitly changes scope."],"evidence":["No pilot approval or clinical validation is recorded."],"artifacts":["future pilot protocol"]}]}],"explanation":[{"id":"purpose","title":"1. What this project is","paragraphs":["Derma_AI is a research prototype for explainable, equity-aware dermatology triage in Uganda/East Africa. It combines a concept-bottleneck image classifier, a small reinforcement-learning triage policy, clinician feedback, fairness monitoring, and a web dashboard.","The research question is comparative: do concept supervision, fairness-weighted triage, and reviewed offline feedback improve reliability and equity over a standard transfer-learning baseline under constrained labels and bandwidth? The project is not currently a validated diagnostic product."],"bullets":["Target conditions in code: benign, melanoma, and Kaposi sarcoma.","Target triage actions in code: routine, follow-up, and urgent.","Planned clinical context: Uganda Cancer Institute and Mbarara Hospital, subject to real agreements and approvals.","Current boundary: research/education only; no autonomous diagnosis or treatment decision."]},{"id":"pipeline","title":"2. End-to-end pipeline","paragraphs":["An image and metadata enter a deterministic preprocessing path. HRNet-W18 extracts visual features; a seven-output bottleneck is intended to represent clinical concepts; a linear head maps those concepts to three diagnosis classes. A separate PPO-style policy receives seven concept scores plus a six-value Fitzpatrick encoding and chooses one of three triage actions.","A clinician can review the output and submit a correction. Corrections enter an offline buffer; a candidate policy update must be evaluated and approved before promotion. The dashboard and fairness tracker record outcomes, overrides, subgroup counts, and audit information. Heatmaps are supporting model evidence, not clinical proof."],"bullets":["Input → quality/permission checks → preprocessing → HRNet features.","Features → seven concept scores → three class logits.","Concepts + skin-tone encoding → triage policy → proposed lane.","Clinician review → correction buffer → offline candidate update → validation → promote or rollback.","Cases and predictions → fairness/uncertainty reports → research dashboard and export."]},{"id":"modules","title":"3. What each part owns","paragraphs":["The codebase already contains the main scaffolding. The roadmap distinguishes a file existing from the behavior being validated."],"table":{"headers":["Component","Files","Responsibility","Current boundary"],"rows":[["Vision + concepts","model.py","HRNet-W18, seven concept outputs, three-class head, Grad-CAM/Integrated Gradients","Concept supervision and explanation faithfulness unvalidated"],["Data pipeline","datasetEquity.py, samplesEquity.py, notebooks/01_train_cbm.py","Load images, transforms, splits, training entry point","Label mapping, source resolution, paths, and leakage controls need repair"],["Triage policy","rl_module.py","Single-step environment, fairness-weighted reward, PPO actor-critic","Must be compared with simpler rule/bandit baselines"],["Human feedback","hitl_pipeline.py","Override buffer and offline optimizer","Update validity, selection bias, review, and rollback unproven"],["Fairness monitor","metrics_tracker.py, scripts/passion_metrics.py","Subgroup metrics, overrides, PASSION escalation summaries","No real-data outputs; empty-stratum and uncertainty handling need audit"],["Application","server.py, dashboard.html, ui.py","API, dashboard, authentication, review workflow","Readiness/fallback contract and full integration tests incomplete"],["Governance","MODEL_CARD.md, SECURITY.md, docs/OPERATIONS.md","Scope, limitations, security and operations","Several referenced evidence files are missing"]]}},{"id":"data","title":"4. Data strategy that matches the labels","paragraphs":["The datasets cannot be blended as though they describe the same task. HAM10000 is dermoscopic and has no real Kaposi sarcoma class. PASSION contains inflammatory/infectious conditions and is used here as an external fairness/escalation cohort, not as benign/melanoma/KS ground truth. Fitzpatrick17k is a possible source of real KS-labelled candidates, but access and clinician audit are required. SKINCON can supply some expert concept annotations, not a complete match for the seven project concepts."],"table":{"headers":["Source","Role","Key caution"],"rows":[["HAM10000","Lesion classification source after explicit label correction","Do not map BCC/AKIEC to benign; no native Fitzpatrick ground truth"],["Fitzpatrick17k","Candidate real KS and skin-tone-labelled clinical images","156 KS-labelled metadata rows are candidates, not an approved cohort"],["PASSION","External subject-level escalation/fairness monitoring","Local subset is 4,016 images; conditions do not match the three diagnosis classes"],["SKINCON","Partial expert concept supervision","Map definitions carefully; annotate missing concepts"],["Synthetic cases","Smoke tests, UI demos, controlled RL experiments","Never substitute for real KS validation"],["Uganda cohort","Future local relevance and external validation","Requires ethics, agreements, de-identification, and clinician labels"]]}},{"id":"evaluation","title":"5. What counts as evidence","paragraphs":["Use a locked, group-aware train/validation/test design. Select models on validation data, then evaluate frozen candidates on sealed test data. Compare a standard classifier, a concept-supervised CBM, fairness-weighted triage, and reviewed feedback under matched conditions. Report uncertainty and subgroup counts; preserve negative results."],"bullets":["Diagnosis: per-class sensitivity/specificity, balanced accuracy, discrimination where valid, calibration, confidence intervals.","Triage: critical-miss rate, over-triage, lane agreement, and clinician-reviewed outcomes.","Fairness: subgroup TPR/FNR gaps with counts and uncertainty; pre-specified trade-offs rather than post-hoc thresholds.","Concepts: expert agreement, intervention effect, and attribution sanity checks.","Human loop: override reasons, review time, update rejection/rollback, and simulated versus real feedback distinction.","PASSION: predicted escalation distributions by subject/condition/skin tone only; not diagnostic accuracy."]},{"id":"risks","title":"6. Decisions that protect the research","paragraphs":["These are design risks, not reasons to abandon the project. They determine whether the final claims are credible."],"bullets":["Domain shift: dermoscopic HAM images and clinical atlas/phone photographs are not interchangeable.","Concept observability: diameter needs scale; pigment intensity is not a validated Fitzpatrick diagnosis.","Single-step RL: the current environment is closer to a contextual bandit; PPO must earn its complexity through comparison.","Override-only feedback is selected data; clinician action is not automatically pathology ground truth.","Skin-tone multipliers encode a value judgment and require clinician review plus over-triage analysis.","Fallback diagnosis is a safety hazard even if renamed from mock to fallback.","Small KS samples may support a feasibility study, not a broad clinical performance claim.","IRB exemption, data licence, and stakeholder interest are three different permissions."]},{"id":"done","title":"7. Four different meanings of done","paragraphs":["Use separate finish lines so a UI milestone cannot masquerade as training or clinical readiness."],"table":{"headers":["Level","Finish line","Current state"],"rows":[["Code complete","Declared contracts work in a clean clone and exact-head CI","Blocked by acceptance/CI gaps"],["Training complete","Reproducible real-data candidate, hash, config, and validation report","Not done; placeholder"],["Research complete","Sealed-test comparisons, fairness, ablations, limitations, and review","Not done; no validated metrics"],["Pilot ready","Separate ethics/regulatory approval, safety case, monitoring, and stop rules","Out of current scope"]]}},{"id":"ritual","title":"8. How to keep the roadmap alive","paragraphs":["Use the dashboard for exploration and the JSON file for versioned truth. A task is done only when its acceptance criteria have evidence. Browser edits are local drafts until exported, reviewed, and committed."],"bullets":["Daily: update the one task you moved; add a commit, run ID, report path, or decision reference.","Weekly: review blockers, choose the next three moves, and rebuild the dashboard/Markdown from JSON.","At a gate: attach the evidence, name the reviewer, and record the decision; do not convert blocked to done by optimism.","When a result changes scope: add a changelog entry and update dependent tasks rather than silently rewriting history.","Never store patient data, secrets, raw restricted images, or access tokens in the tracker."]}],"resources":[{"name":"HAM10000","use":"Lesion classification source","url":"https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/DBW86T","note":"Follow the official terms; correct label semantics before training."},{"name":"Fitzpatrick17k","use":"Real KS candidates + skin-tone metadata","url":"https://github.com/mattgroh/fitzpatrick17k","note":"Request images through the repository route; clinician-audit the 156 KS-labelled candidates."},{"name":"PASSION","use":"External fairness cohort","url":"https://passionderm.github.io/","note":"Request access; respect non-redistribution terms; keep evaluation-only."},{"name":"SKINCON","use":"Partial expert concept annotations","url":"https://skincon-dataset.github.io/","note":"Definitions do not exactly match the seven project concepts."},{"name":"Kaggle Notebooks","use":"GPU compute for permitted data","url":"https://www.kaggle.com/docs/efficient-gpu-usage","note":"Quota applies; do not upload restricted data unless its terms allow it."},{"name":"Institution + clinical partners","use":"Ethics, local cohort, clinician review","url":"","note":"Supervisor → IRB/REC → UCI/Mbarara data agreement; no shortcut through code."}],"evidence_ledger":{"verified":["Remote pre-triage-removal HEAD is 2d23065.","Model manifest is placeholder with null checkpoint SHA-256.","PASSION scripts, tests, manifest, model card, security policy, operations runbook, and README links are tracked.","No GitHub workflow or check run exists for 2d23065.","Definition-of-done references missing storage/backup modules and an incompatible app factory/readiness contract.","The training script still contains malignant-to-benign mapping and PASSION training mixing.","No real-data evaluation metrics or validated frozen checkpoint are recorded."],"reported":["The user reported 15/15 PASSION tests and 11/11 definition-of-done checks locally.","Those totals were not independently reproduced in this roadmap audit and do not establish remote CI or full integration coverage."],"corrections":["PASSION is not a 19k/12-class benign-melanoma-KS training dataset for this project.","A smoke checkpoint is not a frozen validated model.","Renaming mock helpers to fallback does not make fixed clinical payloads safe.","A local pass with copied files is not a fresh-clone pass.","Prototype or stakeholder interest is not pilot authorization."]},"changelog":[{"date":"2026-11-08","change":"Created the Evidence Atlas, interactive tracker, and versioned Markdown roadmap from the verified 2d23065 snapshot.","evidence":"Repository inspection and GitHub check metadata; no application behavior changed."}]};
let baseData = structuredClone(SOURCE);
const STORAGE_KEY = `derma-evidence-atlas:v1:${SOURCE.project.snapshot.short_commit}`;
let local = {};
try { local = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (_) { local = {}; }
let data = structuredClone(baseData);
const ui = {tab:'overview', filter:'all', query:'', open:new Set()};
const STATUS = ['done','partial','reported','todo','blocked','failed'];
const LABEL = {done:'Done',partial:'Partial',reported:'Reported',todo:'To do',blocked:'Blocked',failed:'Needs repair'};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allTasks = () => data.phases.flatMap(p => p.tasks.map(t => ({...t, phase:p})));
function applyLocal(){ data = structuredClone(baseData); for(const t of allTasks()){ const o=local[t.id]; if(o){ if(STATUS.includes(o.status)) t.status=o.status; if(typeof o.note==='string') t.local_note=o.note; } } }
function counts(){ const c={done:0,partial:0,reported:0,todo:0,blocked:0,failed:0}; allTasks().forEach(t=>c[t.status]++); return c; }
function chip(s){ return `<span class="status s-${esc(s)}">${esc(LABEL[s]||s)}</span>`; }
function options(s){ return STATUS.map(x=>`<option value="${x}" ${x===s?'selected':''}>${LABEL[x]}</option>`).join(''); }
function saveLocal(id, patch){ local[id]={...(local[id]||{}),...patch,updated_at:new Date().toISOString()}; try{localStorage.setItem(STORAGE_KEY,JSON.stringify(local));}catch(_){toast('Browser storage unavailable; export to keep edits');} applyLocal(); updateDraft(); }
function updateDraft(){ const n=Object.keys(local).length; const b=$('#draftBadge'); b.textContent=`${n} local edit${n===1?'':'s'}`; b.classList.toggle('on',n>0); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>t.classList.remove('show'),2600); }
function setTab(tab){ ui.tab=tab; document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab))); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function openTask(id){ ui.tab='roadmap'; ui.open.add(id); document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab==='roadmap'))); render(); requestAnimationFrame(()=>{const el=document.getElementById(`task-${id}`); if(el){el.open=true; el.scrollIntoView({behavior:'smooth',block:'center'});}}); }
function hero(){ const s=data.project.snapshot; return `<section class="hero"><svg class="contours" viewBox="0 0 500 500" aria-hidden="true"><g fill="none" stroke="#54d6bd" stroke-width="1.4">${[40,70,100,130,160,190,220].map((r,i)=>`<path d="M ${250-r} 250 C ${250-r} ${250-r*.9}, ${250-r*.3} ${250-r*1.15}, 250 ${250-r} S ${250+r} ${250-r*.6}, ${250+r} 250 S ${250+r*.4} ${250+r}, 250 ${250+r} S ${250-r} ${250+r*.7}, ${250-r} 250 Z" opacity="${1-i*.09}"/>`).join('')}</g></svg><div class="herocopy"><div class="eyebrow">${esc(data.project.context)} · ${esc(data.project.owner)}</div><h1>${esc(data.project.tagline)}</h1><p class="lede">${esc(data.project.north_star)}</p><div class="snapshot"><span class="pill">Snapshot <strong>${esc(s.short_commit)}</strong></span><span class="pill">Checked <strong>${esc(s.checked_on)}</strong></span><span class="pill">Training <strong>${esc(s.training_state)}</strong></span><span class="pill">Validated metrics <strong>${s.validated_metrics}</strong></span></div></div></section>`; }
function overview(){ const c=counts(), total=allTasks().length, pct=Math.round(c.done/total*100); const moves=data.next_moves.map(id=>allTasks().find(t=>t.id===id)).filter(t=>t&&t.status!=='done').slice(0,4); return `${hero()}<div class="stats"><div class="stat"><div class="n">${c.done}<span style="font-size:16px;color:var(--muted)"> / ${total}</span></div><div class="label">Evidence-backed checklist completion</div><div class="meter"><i style="width:${pct}%"></i></div><div class="hint">${pct}% · task acceptance, not lines of code</div></div><div class="stat"><div class="n" style="color:var(--blue)">${c.partial+c.reported}</div><div class="label">Partial or reported</div><div class="hint">Implementation is not yet validation</div></div><div class="stat"><div class="n" style="color:var(--amber)">${c.blocked}</div><div class="label">Blocked tasks</div><div class="hint">Resources, permissions, people, decisions</div></div><div class="stat"><div class="n" style="color:var(--coral)">${c.failed}</div><div class="label">Verified repairs needed</div><div class="hint">Broken contracts, not optimism</div></div></div><div class="grid2"><section class="card"><div class="eyebrow">North star</div><h2>Evidence before altitude</h2><p>Each station has an outcome, dependencies, and a finish line. A task moves to <strong>Done</strong> only when its acceptance criteria have inspectable evidence.</p><p class="callout"><strong>Current reality:</strong> prototype scaffolding exists; training is placeholder; no validated real-data metrics; remote CI and fresh-clone acceptance need repair.</p><div class="sectionhead"><h3>Next moves</h3></div><div class="moves">${moves.map((t,i)=>`<button class="move" data-open="${t.id}"><span class="movenum">${i+1}</span><span><b>${esc(t.title)}</b><small>${esc(t.phase.station)} · ${esc(t.owner)}</small></span>${chip(t.status)}</button>`).join('')}</div></section><section class="card"><div class="eyebrow">Non-negotiables</div><h2>Evidence gates</h2><div class="gates">${data.gates.map(g=>`<div class="gate"><span class="gateid">${g.id}</span><div><strong>${esc(g.name)}</strong><p>${esc(g.rule)}</p></div>${chip(g.status)}</div>`).join('')}</div></section></div><div class="sectionhead"><div><div class="eyebrow">The expedition</div><h2>Seven stations, one evidence chain</h2></div><p>Click a station to inspect its tasks.</p></div>${routeStrip()}<section class="card" style="margin-top:16px"><h3>How to use this atlas</h3><ol><li>Open a task, read <em>How</em> and <em>Done when</em>, then attach evidence.</li><li>Change status or add a note in the browser; edits stay local to this device.</li><li><strong>Export progress</strong>, replace <code>docs/roadmap/status.json</code>, review the diff, and run <code>python3 docs/roadmap/build.py</code>.</li><li>Commit the JSON, rebuilt HTML, and <code>ROADMAP.md</code> together. The versioned files—not browser memory—are the team truth.</li></ol></section>`; }
function routeStrip(){ return `<div class="route" aria-label="Roadmap stations">${data.phases.map((p,i)=>{const d=p.tasks.filter(t=>t.status==='done').length;return `<button class="routenode ${i===0?'current':''} ${d===p.tasks.length?'complete':''}" data-phase="${p.id}"><span class="nodecircle">${i}</span><span class="nodename">${esc(p.station)}</span><span class="nodewindow">${esc(p.window)}</span><span class="nodecount">${d}/${p.tasks.length} verified</span></button>`}).join('')}</div>`; }
function taskDetail(t){ return `<details class="task" id="task-${t.id}" ${ui.open.has(t.id)?'open':''}><summary><span class="taskid">${t.id}</span><span class="tasktitle">${esc(t.title)}</span><span class="tasksummarymeta">${esc(t.owner)} · ${esc(t.effort)}</span>${chip(t.status)}<span class="chev" aria-hidden="true">›</span></summary><div class="taskbody"><div class="taskcols"><div><h4>How to do it</h4><ol>${t.how.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h4>Done when</h4><ul>${t.done_when.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h4>Evidence on record</h4>${t.evidence.map(x=>`<div class="evidence">${esc(x)}</div>`).join('')}<h4>Expected artifacts</h4><div class="artifacts">${t.artifacts.map(x=>`<code>${esc(x)}</code>`).join('')}</div><div class="editrow"><label><span class="localhint">Status draft</span><select class="statusselect" data-status="${t.id}" aria-label="Status for ${t.id}">${options(t.status)}</select></label><label><span class="localhint">Evidence / decision note</span><textarea class="note" data-note="${t.id}" placeholder="Commit hash, CI run, report path, reviewer, decision…">${esc(t.local_note||'')}</textarea></label></div><div class="localhint">Browser edits are local drafts. Export and commit to make them official.</div></div></div></div></details>`; }
function matches(t){ const q=ui.query.toLowerCase(); const okQ=!q||[t.id,t.title,t.owner,t.phase.station,...t.how,...t.evidence].join(' ').toLowerCase().includes(q); const okF=ui.filter==='all'||(ui.filter==='actionable'?['todo','failed','partial'].includes(t.status):t.status===ui.filter); return okQ&&okF; }
function toolbar(){ return `<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search tasks, owners, evidence…" value="${esc(ui.query)}" aria-label="Search tasks"><div class="filters">${['all','actionable','blocked','reported','done'].map(f=>`<button class="filter ${ui.filter===f?'active':''}" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div></div>`; }
function roadmap(){ return `<div class="sectionhead"><div><div class="eyebrow">Route map</div><h2>Follow the dependency chain</h2><p>Windows are indicative. External gates can extend the schedule; they are not promises.</p></div></div>${routeStrip()}${toolbar()}${data.phases.map(p=>{const ts=p.tasks.filter(matches); if(!ts.length)return ''; const d=p.tasks.filter(t=>t.status==='done').length; return `<section class="phase" id="phase-${p.id}"><div class="phasehead"><div class="phasekicker"><span>${p.id} · ${esc(p.station)}</span><span>·</span><span>${esc(p.window)}</span></div><h2>${esc(p.name)}</h2><p><strong>Outcome:</strong> ${esc(p.outcome)}</p><p>${esc(p.why)}</p><div class="phasemeta">${chip(p.status)}<span class="pill">${d}/${p.tasks.length} done</span>${p.depends_on.length?`<span class="pill">Depends on ${p.depends_on.map(esc).join(', ')}</span>`:'<span class="pill">Entry station</span>'}</div><div class="meter"><i style="width:${Math.round(d/p.tasks.length*100)}%"></i></div></div><div class="phasebody">${ts.map(taskDetail).join('')}</div></section>`}).join('')||'<div class="empty">No tasks match this view.</div>'}`; }
function tasks(){ const ts=allTasks().filter(matches); return `<div class="sectionhead"><div><div class="eyebrow">Task board</div><h2>${ts.length} visible tasks</h2><p>Change a status here, then open the task to attach evidence.</p></div></div>${toolbar()}<div class="tablewrap"><table><thead><tr><th>ID</th><th>Task</th><th>Station</th><th>Status</th><th>Owner</th><th>Priority</th></tr></thead><tbody>${ts.map(t=>`<tr><td class="taskid">${t.id}</td><td><button class="tasklink" data-open="${t.id}">${esc(t.title)}</button>${t.local_note?`<div class="localhint">Local note added</div>`:''}</td><td>${esc(t.phase.station)}</td><td><select class="statusselect" data-status="${t.id}" aria-label="Status for ${t.id}">${options(t.status)}</select></td><td>${esc(t.owner)}</td><td>${esc(t.priority)}</td></tr>`).join('')}</tbody></table>${ts.length?'':'<div class="empty">No tasks match.</div>'}</div>`; }
function renderTable(t){ return `<div class="tablewrap"><table><thead><tr>${t.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
function explained(){ return `<div class="explainer"><div class="sectionhead"><div><div class="eyebrow">Full explanation</div><h2>The project, without the hype</h2><p>${esc(data.project.subtitle)}</p></div></div><p class="callout">${esc(data.project.disclaimer)}</p>${data.explanation.map(s=>`<section class="explainsection" id="explain-${s.id}"><h2>${esc(s.title)}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${s.bullets?`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}${s.table?renderTable(s.table):''}</section>`).join('')}<div class="sectionhead"><div><div class="eyebrow">Resource map</div><h2>Where the inputs come from</h2></div></div><div class="resources">${data.resources.map(r=>`<article class="resource"><h3>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a>`:esc(r.name)}</h3><div class="eyebrow">${esc(r.use)}</div><p>${esc(r.note)}</p></article>`).join('')}</div></div>`; }
function evidence(){ const l=data.evidence_ledger; return `<div class="sectionhead"><div><div class="eyebrow">Evidence log</div><h2>Separate fact, report, and correction</h2><p>${esc(data.project.snapshot.scope)}</p></div></div><div class="ledger"><section class="card"><h3>Verified in this audit</h3><ul>${l.verified.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="card reportedcard"><h3>Reported, not reproduced</h3><ul>${l.reported.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="card correctioncard"><h3>Claims we must not repeat</h3><ul>${l.corrections.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section></div><section class="card changelog"><h2>Changelog</h2>${data.changelog.map(c=>`<div class="change"><time>${esc(c.date)}</time><div>${esc(c.change)}<small>${esc(c.evidence)}</small></div></div>`).join('')}</section><section class="card" style="margin-top:18px"><h2>Update protocol</h2><pre>1. Edit statuses/evidence in the dashboard or status.json.
2. Export progress and replace docs/roadmap/status.json.
3. Run: python3 docs/roadmap/build.py
4. Review the diff, then commit JSON + HTML + ROADMAP.md together.
5. A gate closes only with evidence and a named reviewer.</pre><p class="callout">Do not store patient data, secrets, restricted images, or access tokens here. “Reported” is not “verified”; “partial” is not “done.”</p></section>`; }
function render(){ applyLocal(); const views={overview,roadmap,tasks,explained,evidence}; $('#main').innerHTML=views[ui.tab](); updateDraft(); $('#footerSnapshot').textContent=`Snapshot: ${data.project.snapshot.remote_branch} @ ${data.project.snapshot.short_commit} · checked ${data.project.snapshot.checked_on}.`; document.querySelectorAll('.task').forEach(d=>d.addEventListener('toggle',()=>{const id=d.id.replace('task-',''); d.open?ui.open.add(id):ui.open.delete(id);})); }
function validateImport(x){ if(!x||x.schema_version!==1||!x.project?.snapshot||!Array.isArray(x.phases)||!Array.isArray(x.gates)) throw new Error('Not a Derma_AI roadmap v1 file'); const ids=new Set(); for(const p of x.phases){if(!p.id||!Array.isArray(p.tasks))throw new Error('Invalid phase'); for(const t of p.tasks){if(!t.id||ids.has(t.id)||!STATUS.includes(t.status)||!Array.isArray(t.how)||!Array.isArray(t.done_when))throw new Error('Invalid task '+t.id); ids.add(t.id);}} return x; }
function exportJSON(){ applyLocal(); const payload=structuredClone(data); payload.project.snapshot.last_local_export=new Date().toISOString(); const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='status.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Exported status.json — replace, rebuild, review, commit'); }
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]'); if(tab)return setTab(tab.dataset.tab); const op=e.target.closest('[data-open]'); if(op)return openTask(op.dataset.open); const ph=e.target.closest('[data-phase]'); if(ph){ui.tab='roadmap';document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab==='roadmap')));render();requestAnimationFrame(()=>document.getElementById(`phase-${ph.dataset.phase}`)?.scrollIntoView({behavior:'smooth'}));return;} const f=e.target.closest('[data-filter]'); if(f){ui.filter=f.dataset.filter;render();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.query=e.target.value; const pos=e.target.selectionStart; render(); const s=$('#search'); if(s){s.focus();try{s.setSelectionRange(pos,pos);}catch(_){} }} if(e.target.matches('[data-note]')) saveLocal(e.target.dataset.note,{note:e.target.value});});
document.addEventListener('change',e=>{if(e.target.matches('[data-status]')){saveLocal(e.target.dataset.status,{status:e.target.value});render();toast('Local status updated — attach evidence before export');}});
$('#exportBtn').addEventListener('click',exportJSON);$('#printBtn').addEventListener('click',()=>window.print());$('#importBtn').addEventListener('click',()=>$('#importFile').click());$('#resetBtn').addEventListener('click',()=>{if(confirm('Discard browser-only edits and return to the generated snapshot?')){local={};localStorage.removeItem(STORAGE_KEY);applyLocal();render();toast('Local edits discarded');}});$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const x=validateImport(JSON.parse(await file.text()));baseData=structuredClone(x);local={};localStorage.removeItem(STORAGE_KEY);applyLocal();render();toast('Imported roadmap snapshot');}catch(err){toast('Import failed: '+err.message);}e.target.value='';});
applyLocal();render();
</script>
</body>
