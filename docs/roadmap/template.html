<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Derma_AI Evidence Atlas — an interactive, evidence-led research roadmap. Research only; not a medical device.">
<title>Derma_AI · Evidence Atlas</title>
<style>
:root{--bg:#0d161e;--panel:#14222d;--panel2:#192b38;--ink:#f4f0e7;--muted:#a8b8c2;--line:#2a404e;--teal:#54d6bd;--amber:#f2bd63;--coral:#ff806e;--blue:#82b7ff;--green:#8ddb9b;--radius:18px;--shadow:0 18px 50px #0003;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--teal)}:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.shell{max-width:1240px;margin:auto;padding:0 24px}.topbar{border-bottom:1px solid var(--line);background:#0d161eee;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.topbar .shell{display:flex;align-items:center;gap:18px;min-height:70px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.brandmark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:concentric-gradient;background:radial-gradient(circle at 50% 50%,var(--teal) 0 16%,transparent 18% 31%,var(--teal) 33% 39%,transparent 41% 55%,var(--teal) 57% 62%,transparent 64%);border:1px solid var(--teal)}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.topactions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:650;font-size:13px}.btn:hover{border-color:var(--teal);transform:translateY(-1px)}.btn.primary{background:var(--teal);color:#08231e;border-color:var(--teal)}.btn.ghost{background:transparent}.draft{font-size:12px;color:var(--amber);display:none}.draft.on{display:inline}.tabs{display:flex;gap:4px;padding:10px 0;overflow:auto}.tab{border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px;font-weight:700;white-space:nowrap}.tab[aria-selected=true]{background:var(--panel2);color:var(--teal)}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;margin:26px 0 20px;padding:42px;background:linear-gradient(135deg,#172c36,#101b24 65%);box-shadow:var(--shadow)}.herocopy{position:relative;z-index:1;max-width:760px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:800;color:var(--teal)}h1,h2,h3{line-height:1.15;margin:0 0 12px}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(36px,6vw,66px);font-weight:500;letter-spacing:-.035em}h2{font-size:27px;letter-spacing:-.02em}h3{font-size:18px}.lede{font-size:18px;color:#d3dee3;max-width:700px}.contours{position:absolute;right:-80px;top:-70px;width:520px;height:520px;opacity:.22;pointer-events:none}.snapshot{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted);background:#0d161e88}.pill strong{color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.stat .n{font-size:32px;font-weight:800;line-height:1.1}.stat .label{color:var(--muted);font-size:12px;margin-top:7px}.stat .hint{font-size:11px;color:var(--muted);margin-top:8px}.meter{height:7px;background:#0b141b;border-radius:99px;overflow:hidden;margin-top:12px}.meter i{display:block;height:100%;background:var(--teal);border-radius:99px}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px}.card p:first-child{margin-top:0}.card p:last-child{margin-bottom:0}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:30px 0 14px}.sectionhead p{margin:0;color:var(--muted)}.route{display:flex;gap:0;overflow:auto;padding:12px 0 20px}.routenode{min-width:154px;flex:1;position:relative;text-align:left;background:transparent;border:0;color:var(--ink);padding:0 12px 0 0}.routenode:not(:last-child):after{content:'';position:absolute;height:2px;background:var(--line);left:34px;right:0;top:17px}.nodecircle{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--line);font-weight:800;font-size:12px;margin-bottom:10px}.routenode.current .nodecircle{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 5px #f2bd6318}.routenode.complete .nodecircle{border-color:var(--teal);color:var(--teal)}.nodename{font-weight:750;font-size:13px;display:block}.nodewindow{font-size:11px;color:var(--muted);display:block}.nodecount{font-size:11px;color:var(--teal)}.gates{display:grid;gap:10px}.gate{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:13px;background:#0e1a22}.gateid{font-weight:850;color:var(--amber)}.gate p{margin:3px 0 0;color:var(--muted);font-size:13px}.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}.status:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.s-done{color:var(--green);background:#8ddb9b16}.s-partial{color:var(--blue);background:#82b7ff16}.s-reported{color:#c7a8ff;background:#c7a8ff16}.s-todo{color:var(--muted);background:#a8b8c216}.s-blocked{color:var(--amber);background:#f2bd6316}.s-failed{color:var(--coral);background:#ff806e16}.moves{display:grid;gap:10px}.move{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:#0e1a22;border:1px solid var(--line);border-radius:12px;padding:13px;text-align:left;color:var(--ink)}.move:hover{border-color:var(--teal)}.move b{display:block}.move small{color:var(--muted)}.movenum{width:30px;height:30px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;color:var(--teal);font-weight:800}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:10px 13px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 10px;font-size:12px}.filter.active{color:var(--teal);border-color:var(--teal);background:#54d6bd12}.phase{scroll-margin-top:150px;border:1px solid var(--line);border-radius:22px;margin:18px 0;overflow:hidden;background:var(--panel)}.phasehead{padding:25px;background:linear-gradient(110deg,var(--panel2),var(--panel));border-bottom:1px solid var(--line)}.phasekicker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--teal);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.phasehead h2{margin:9px 0}.phasehead p{color:var(--muted);margin:6px 0}.phasemeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.phasebody{padding:10px 20px 20px}.task{border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task summary{list-style:none;display:grid;grid-template-columns:62px minmax(0,1fr) auto auto 18px;gap:12px;align-items:center;padding:17px 4px;cursor:pointer}.task summary::-webkit-details-marker{display:none}.taskid{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--teal);font-size:12px;font-weight:800}.tasktitle{font-weight:730}.tasksummarymeta{color:var(--muted);font-size:12px}.chev{color:var(--muted);transition:transform .2s}.task[open] .chev{transform:rotate(90deg)}.taskbody{padding:0 4px 22px 78px}.taskcols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.taskbody h4{margin:12px 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--teal)}.taskbody ol,.taskbody ul{margin:6px 0;padding-left:20px}.taskbody li{margin:5px 0}.evidence{border-left:3px solid var(--amber);background:#f2bd630b;padding:10px 13px;margin:12px 0;border-radius:0 8px 8px 0;color:#d8e0e4;font-size:13px}.artifacts{display:flex;gap:6px;flex-wrap:wrap}.artifacts code{font-size:11px;background:#0b151d;border:1px solid var(--line);border-radius:6px;padding:3px 6px;overflow-wrap:anywhere}.editrow{display:grid;grid-template-columns:190px 1fr;gap:12px;margin-top:16px;align-items:start}.statusselect{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px}.note{width:100%;min-height:70px;resize:vertical;background:#0d1820;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px}.localhint{font-size:11px;color:var(--amber);margin-top:5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--teal);font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:var(--panel2)}tr:last-child td{border-bottom:0}.tasklink{background:none;border:0;color:var(--ink);font-weight:700;text-align:left;padding:0}.tasklink:hover{color:var(--teal)}.explainer{max-width:960px;margin:auto}.explainsection{margin:20px 0;padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.explainsection p{color:#d4dee3}.explainsection li{margin:7px 0}.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.resource{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.resource h3{font-size:16px}.resource p{font-size:13px;color:var(--muted)}.ledger{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.ledger ul{padding-left:20px}.ledger li{margin:9px 0;color:#d4dee3}.ledger .card{border-top:3px solid var(--teal)}.ledger .reportedcard{border-top-color:#c7a8ff}.ledger .correctioncard{border-top-color:var(--coral)}.changelog{margin-top:18px}.change{display:grid;grid-template-columns:110px 1fr;gap:15px;border-top:1px solid var(--line);padding:14px 0}.change time{color:var(--teal);font-weight:700}.change small{display:block;color:var(--muted)}.callout{border:1px solid #f2bd6355;background:#f2bd630c;border-radius:14px;padding:17px;color:#ead9b8}.empty{padding:35px;text-align:center;color:var(--muted)}footer{margin:40px 0 24px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:12px}.toast{position:fixed;right:22px;bottom:22px;background:var(--teal);color:#08231e;padding:12px 17px;border-radius:12px;font-weight:750;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:none}.hidden{display:none!important}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}pre{white-space:pre-wrap;background:#0b151d;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.taskcols,.ledger{grid-template-columns:1fr}.resources{grid-template-columns:repeat(2,1fr)}.hero{padding:30px}.topbar .shell{flex-wrap:wrap;padding-top:10px;padding-bottom:10px}.topactions{margin-left:0}.taskbody{padding-left:10px}.task summary{grid-template-columns:54px minmax(0,1fr) auto 18px}.tasksummarymeta{display:none}}
@media(max-width:560px){.shell{padding:0 14px}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:15px}.stat .n{font-size:25px}.hero{padding:24px;border-radius:18px}.resources{grid-template-columns:1fr}.editrow{grid-template-columns:1fr}.task summary{grid-template-columns:48px minmax(0,1fr) auto 14px;gap:7px}.tasktitle{font-size:14px}.phasehead{padding:20px}.phasebody{padding:8px 12px 14px}.explainsection{padding:21px}.brand small{display:none}.btn{padding:7px 9px}.sectionhead{display:block}.gate{grid-template-columns:auto 1fr}.gate .status{grid-column:2}.change{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{:root{--bg:#fff;--panel:#fff;--panel2:#f3f5f6;--ink:#111;--muted:#444;--line:#bbb;--teal:#00695c;--amber:#8a5a00;--coral:#a32616;color-scheme:light}body{font-size:11px}.topbar,.toolbar,.topactions,.toast,.route,.editrow,.draft{display:none!important}.shell{max-width:none;padding:0}.hero{box-shadow:none;background:#fff;padding:18px;margin:0 0 12px}.contours{display:none}h1{font-size:32px}.stats{grid-template-columns:repeat(4,1fr)}.card,.phase,.explainsection,.resource{break-inside:avoid;box-shadow:none}.task{break-inside:avoid}.taskbody{display:block!important;padding-left:10px}.task summary{padding:8px 0}.grid2,.ledger,.resources{grid-template-columns:1fr 1fr}footer{margin-top:18px}a{color:#00695c;text-decoration:none}}
</style>
</head>
<body>
<header class="topbar"><div class="shell"><div class="brand"><span class="brandmark" aria-hidden="true"></span><span>Derma_AI<small>Evidence Atlas</small></span></div><div class="topactions"><span id="draftBadge" class="draft">Local draft</span><button class="btn ghost" id="importBtn">Import JSON</button><button class="btn primary" id="exportBtn">Export progress</button><button class="btn ghost" id="printBtn">Print</button><button class="btn ghost" id="resetBtn" title="Discard browser-only edits">Reset local</button><input type="file" id="importFile" accept="application/json,.json" hidden></div></div><div class="shell"><nav class="tabs" role="tablist" aria-label="Roadmap views"><button class="tab" role="tab" data-tab="overview" aria-selected="true">Overview</button><button class="tab" role="tab" data-tab="roadmap" aria-selected="false">Route map</button><button class="tab" role="tab" data-tab="tasks" aria-selected="false">Task board</button><button class="tab" role="tab" data-tab="explained" aria-selected="false">Project explained</button><button class="tab" role="tab" data-tab="evidence" aria-selected="false">Evidence log</button></nav></div></header>
<main class="shell" id="main"></main>
<footer class="shell"><strong>Research and educational use only.</strong> Not a medical device, not a clinical diagnosis system, and not a basis for treatment decisions. Browser edits are drafts until exported, reviewed, and committed. No patient data or secrets belong in this tracker.<div id="footerSnapshot"></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const SOURCE = /*__ROADMAP_DATA__*/null;
let baseData = structuredClone(SOURCE);
const STORAGE_KEY = `derma-evidence-atlas:v1:${SOURCE.project.snapshot.short_commit}`;
let local = {};
try { local = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (_) { local = {}; }
let data = structuredClone(baseData);
const ui = {tab:'overview', filter:'all', query:'', open:new Set()};
const STATUS = ['done','partial','reported','todo','blocked','failed'];
const LABEL = {done:'Done',partial:'Partial',reported:'Reported',todo:'To do',blocked:'Blocked',failed:'Needs repair'};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allTasks = () => data.phases.flatMap(p => p.tasks.map(t => ({...t, phase:p})));
function applyLocal(){ data = structuredClone(baseData); for(const t of allTasks()){ const o=local[t.id]; if(o){ if(STATUS.includes(o.status)) t.status=o.status; if(typeof o.note==='string') t.local_note=o.note; } } }
function counts(){ const c={done:0,partial:0,reported:0,todo:0,blocked:0,failed:0}; allTasks().forEach(t=>c[t.status]++); return c; }
function chip(s){ return `<span class="status s-${esc(s)}">${esc(LABEL[s]||s)}</span>`; }
function options(s){ return STATUS.map(x=>`<option value="${x}" ${x===s?'selected':''}>${LABEL[x]}</option>`).join(''); }
function saveLocal(id, patch){ local[id]={...(local[id]||{}),...patch,updated_at:new Date().toISOString()}; try{localStorage.setItem(STORAGE_KEY,JSON.stringify(local));}catch(_){toast('Browser storage unavailable; export to keep edits');} applyLocal(); updateDraft(); }
function updateDraft(){ const n=Object.keys(local).length; const b=$('#draftBadge'); b.textContent=`${n} local edit${n===1?'':'s'}`; b.classList.toggle('on',n>0); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>t.classList.remove('show'),2600); }
function setTab(tab){ ui.tab=tab; document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab))); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function openTask(id){ ui.tab='roadmap'; ui.open.add(id); document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab==='roadmap'))); render(); requestAnimationFrame(()=>{const el=document.getElementById(`task-${id}`); if(el){el.open=true; el.scrollIntoView({behavior:'smooth',block:'center'});}}); }
function hero(){ const s=data.project.snapshot; return `<section class="hero"><svg class="contours" viewBox="0 0 500 500" aria-hidden="true"><g fill="none" stroke="#54d6bd" stroke-width="1.4">${[40,70,100,130,160,190,220].map((r,i)=>`<path d="M ${250-r} 250 C ${250-r} ${250-r*.9}, ${250-r*.3} ${250-r*1.15}, 250 ${250-r} S ${250+r} ${250-r*.6}, ${250+r} 250 S ${250+r*.4} ${250+r}, 250 ${250+r} S ${250-r} ${250+r*.7}, ${250-r} 250 Z" opacity="${1-i*.09}"/>`).join('')}</g></svg><div class="herocopy"><div class="eyebrow">${esc(data.project.context)} · ${esc(data.project.owner)}</div><h1>${esc(data.project.tagline)}</h1><p class="lede">${esc(data.project.north_star)}</p><div class="snapshot"><span class="pill">Snapshot <strong>${esc(s.short_commit)}</strong></span><span class="pill">Checked <strong>${esc(s.checked_on)}</strong></span><span class="pill">Training <strong>${esc(s.training_state)}</strong></span><span class="pill">Validated metrics <strong>${s.validated_metrics}</strong></span></div></div></section>`; }
function overview(){ const c=counts(), total=allTasks().length, pct=Math.round(c.done/total*100); const moves=data.next_moves.map(id=>allTasks().find(t=>t.id===id)).filter(t=>t&&t.status!=='done').slice(0,4); return `${hero()}<div class="stats"><div class="stat"><div class="n">${c.done}<span style="font-size:16px;color:var(--muted)"> / ${total}</span></div><div class="label">Evidence-backed checklist completion</div><div class="meter"><i style="width:${pct}%"></i></div><div class="hint">${pct}% · task acceptance, not lines of code</div></div><div class="stat"><div class="n" style="color:var(--blue)">${c.partial+c.reported}</div><div class="label">Partial or reported</div><div class="hint">Implementation is not yet validation</div></div><div class="stat"><div class="n" style="color:var(--amber)">${c.blocked}</div><div class="label">Blocked tasks</div><div class="hint">Resources, permissions, people, decisions</div></div><div class="stat"><div class="n" style="color:var(--coral)">${c.failed}</div><div class="label">Verified repairs needed</div><div class="hint">Broken contracts, not optimism</div></div></div><div class="grid2"><section class="card"><div class="eyebrow">North star</div><h2>Evidence before altitude</h2><p>Each station has an outcome, dependencies, and a finish line. A task moves to <strong>Done</strong> only when its acceptance criteria have inspectable evidence.</p><p class="callout"><strong>Current reality:</strong> prototype scaffolding exists; training is placeholder; no validated real-data metrics; remote CI and fresh-clone acceptance need repair.</p><div class="sectionhead"><h3>Next moves</h3></div><div class="moves">${moves.map((t,i)=>`<button class="move" data-open="${t.id}"><span class="movenum">${i+1}</span><span><b>${esc(t.title)}</b><small>${esc(t.phase.station)} · ${esc(t.owner)}</small></span>${chip(t.status)}</button>`).join('')}</div></section><section class="card"><div class="eyebrow">Non-negotiables</div><h2>Evidence gates</h2><div class="gates">${data.gates.map(g=>`<div class="gate"><span class="gateid">${g.id}</span><div><strong>${esc(g.name)}</strong><p>${esc(g.rule)}</p></div>${chip(g.status)}</div>`).join('')}</div></section></div><div class="sectionhead"><div><div class="eyebrow">The expedition</div><h2>Seven stations, one evidence chain</h2></div><p>Click a station to inspect its tasks.</p></div>${routeStrip()}<section class="card" style="margin-top:16px"><h3>How to use this atlas</h3><ol><li>Open a task, read <em>How</em> and <em>Done when</em>, then attach evidence.</li><li>Change status or add a note in the browser; edits stay local to this device.</li><li><strong>Export progress</strong>, replace <code>docs/roadmap/status.json</code>, review the diff, and run <code>python3 docs/roadmap/build.py</code>.</li><li>Commit the JSON, rebuilt HTML, and <code>ROADMAP.md</code> together. The versioned files—not browser memory—are the team truth.</li></ol></section>`; }
function routeStrip(){ return `<div class="route" aria-label="Roadmap stations">${data.phases.map((p,i)=>{const d=p.tasks.filter(t=>t.status==='done').length;return `<button class="routenode ${i===0?'current':''} ${d===p.tasks.length?'complete':''}" data-phase="${p.id}"><span class="nodecircle">${i}</span><span class="nodename">${esc(p.station)}</span><span class="nodewindow">${esc(p.window)}</span><span class="nodecount">${d}/${p.tasks.length} verified</span></button>`}).join('')}</div>`; }
function taskDetail(t){ return `<details class="task" id="task-${t.id}" ${ui.open.has(t.id)?'open':''}><summary><span class="taskid">${t.id}</span><span class="tasktitle">${esc(t.title)}</span><span class="tasksummarymeta">${esc(t.owner)} · ${esc(t.effort)}</span>${chip(t.status)}<span class="chev" aria-hidden="true">›</span></summary><div class="taskbody"><div class="taskcols"><div><h4>How to do it</h4><ol>${t.how.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h4>Done when</h4><ul>${t.done_when.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h4>Evidence on record</h4>${t.evidence.map(x=>`<div class="evidence">${esc(x)}</div>`).join('')}<h4>Expected artifacts</h4><div class="artifacts">${t.artifacts.map(x=>`<code>${esc(x)}</code>`).join('')}</div><div class="editrow"><label><span class="localhint">Status draft</span><select class="statusselect" data-status="${t.id}" aria-label="Status for ${t.id}">${options(t.status)}</select></label><label><span class="localhint">Evidence / decision note</span><textarea class="note" data-note="${t.id}" placeholder="Commit hash, CI run, report path, reviewer, decision…">${esc(t.local_note||'')}</textarea></label></div><div class="localhint">Browser edits are local drafts. Export and commit to make them official.</div></div></div></div></details>`; }
function matches(t){ const q=ui.query.toLowerCase(); const okQ=!q||[t.id,t.title,t.owner,t.phase.station,...t.how,...t.evidence].join(' ').toLowerCase().includes(q); const okF=ui.filter==='all'||(ui.filter==='actionable'?['todo','failed','partial'].includes(t.status):t.status===ui.filter); return okQ&&okF; }
function toolbar(){ return `<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search tasks, owners, evidence…" value="${esc(ui.query)}" aria-label="Search tasks"><div class="filters">${['all','actionable','blocked','reported','done'].map(f=>`<button class="filter ${ui.filter===f?'active':''}" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div></div>`; }
function roadmap(){ return `<div class="sectionhead"><div><div class="eyebrow">Route map</div><h2>Follow the dependency chain</h2><p>Windows are indicative. External gates can extend the schedule; they are not promises.</p></div></div>${routeStrip()}${toolbar()}${data.phases.map(p=>{const ts=p.tasks.filter(matches); if(!ts.length)return ''; const d=p.tasks.filter(t=>t.status==='done').length; return `<section class="phase" id="phase-${p.id}"><div class="phasehead"><div class="phasekicker"><span>${p.id} · ${esc(p.station)}</span><span>·</span><span>${esc(p.window)}</span></div><h2>${esc(p.name)}</h2><p><strong>Outcome:</strong> ${esc(p.outcome)}</p><p>${esc(p.why)}</p><div class="phasemeta">${chip(p.status)}<span class="pill">${d}/${p.tasks.length} done</span>${p.depends_on.length?`<span class="pill">Depends on ${p.depends_on.map(esc).join(', ')}</span>`:'<span class="pill">Entry station</span>'}</div><div class="meter"><i style="width:${Math.round(d/p.tasks.length*100)}%"></i></div></div><div class="phasebody">${ts.map(taskDetail).join('')}</div></section>`}).join('')||'<div class="empty">No tasks match this view.</div>'}`; }
function tasks(){ const ts=allTasks().filter(matches); return `<div class="sectionhead"><div><div class="eyebrow">Task board</div><h2>${ts.length} visible tasks</h2><p>Change a status here, then open the task to attach evidence.</p></div></div>${toolbar()}<div class="tablewrap"><table><thead><tr><th>ID</th><th>Task</th><th>Station</th><th>Status</th><th>Owner</th><th>Priority</th></tr></thead><tbody>${ts.map(t=>`<tr><td class="taskid">${t.id}</td><td><button class="tasklink" data-open="${t.id}">${esc(t.title)}</button>${t.local_note?`<div class="localhint">Local note added</div>`:''}</td><td>${esc(t.phase.station)}</td><td><select class="statusselect" data-status="${t.id}" aria-label="Status for ${t.id}">${options(t.status)}</select></td><td>${esc(t.owner)}</td><td>${esc(t.priority)}</td></tr>`).join('')}</tbody></table>${ts.length?'':'<div class="empty">No tasks match.</div>'}</div>`; }
function renderTable(t){ return `<div class="tablewrap"><table><thead><tr>${t.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }
function explained(){ return `<div class="explainer"><div class="sectionhead"><div><div class="eyebrow">Full explanation</div><h2>The project, without the hype</h2><p>${esc(data.project.subtitle)}</p></div></div><p class="callout">${esc(data.project.disclaimer)}</p>${data.explanation.map(s=>`<section class="explainsection" id="explain-${s.id}"><h2>${esc(s.title)}</h2>${(s.paragraphs||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${s.bullets?`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}${s.table?renderTable(s.table):''}</section>`).join('')}<div class="sectionhead"><div><div class="eyebrow">Resource map</div><h2>Where the inputs come from</h2></div></div><div class="resources">${data.resources.map(r=>`<article class="resource"><h3>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a>`:esc(r.name)}</h3><div class="eyebrow">${esc(r.use)}</div><p>${esc(r.note)}</p></article>`).join('')}</div></div>`; }
function evidence(){ const l=data.evidence_ledger; return `<div class="sectionhead"><div><div class="eyebrow">Evidence log</div><h2>Separate fact, report, and correction</h2><p>${esc(data.project.snapshot.scope)}</p></div></div><div class="ledger"><section class="card"><h3>Verified in this audit</h3><ul>${l.verified.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="card reportedcard"><h3>Reported, not reproduced</h3><ul>${l.reported.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="card correctioncard"><h3>Claims we must not repeat</h3><ul>${l.corrections.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section></div><section class="card changelog"><h2>Changelog</h2>${data.changelog.map(c=>`<div class="change"><time>${esc(c.date)}</time><div>${esc(c.change)}<small>${esc(c.evidence)}</small></div></div>`).join('')}</section><section class="card" style="margin-top:18px"><h2>Update protocol</h2><pre>1. Edit statuses/evidence in the dashboard or status.json.
2. Export progress and replace docs/roadmap/status.json.
3. Run: python3 docs/roadmap/build.py
4. Review the diff, then commit JSON + HTML + ROADMAP.md together.
5. A gate closes only with evidence and a named reviewer.</pre><p class="callout">Do not store patient data, secrets, restricted images, or access tokens here. “Reported” is not “verified”; “partial” is not “done.”</p></section>`; }
function render(){ applyLocal(); const views={overview,roadmap,tasks,explained,evidence}; $('#main').innerHTML=views[ui.tab](); updateDraft(); $('#footerSnapshot').textContent=`Snapshot: ${data.project.snapshot.remote_branch} @ ${data.project.snapshot.short_commit} · checked ${data.project.snapshot.checked_on}.`; document.querySelectorAll('.task').forEach(d=>d.addEventListener('toggle',()=>{const id=d.id.replace('task-',''); d.open?ui.open.add(id):ui.open.delete(id);})); }
function validateImport(x){ if(!x||x.schema_version!==1||!x.project?.snapshot||!Array.isArray(x.phases)||!Array.isArray(x.gates)) throw new Error('Not a Derma_AI roadmap v1 file'); const ids=new Set(); for(const p of x.phases){if(!p.id||!Array.isArray(p.tasks))throw new Error('Invalid phase'); for(const t of p.tasks){if(!t.id||ids.has(t.id)||!STATUS.includes(t.status)||!Array.isArray(t.how)||!Array.isArray(t.done_when))throw new Error('Invalid task '+t.id); ids.add(t.id);}} return x; }
function exportJSON(){ applyLocal(); const payload=structuredClone(data); payload.project.snapshot.last_local_export=new Date().toISOString(); const blob=new Blob([JSON.stringify(payload,null,2)+'\n'],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='status.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Exported status.json — replace, rebuild, review, commit'); }
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]'); if(tab)return setTab(tab.dataset.tab); const op=e.target.closest('[data-open]'); if(op)return openTask(op.dataset.open); const ph=e.target.closest('[data-phase]'); if(ph){ui.tab='roadmap';document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab==='roadmap')));render();requestAnimationFrame(()=>document.getElementById(`phase-${ph.dataset.phase}`)?.scrollIntoView({behavior:'smooth'}));return;} const f=e.target.closest('[data-filter]'); if(f){ui.filter=f.dataset.filter;render();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.query=e.target.value; const pos=e.target.selectionStart; render(); const s=$('#search'); if(s){s.focus();try{s.setSelectionRange(pos,pos);}catch(_){} }} if(e.target.matches('[data-note]')) saveLocal(e.target.dataset.note,{note:e.target.value});});
document.addEventListener('change',e=>{if(e.target.matches('[data-status]')){saveLocal(e.target.dataset.status,{status:e.target.value});render();toast('Local status updated — attach evidence before export');}});
$('#exportBtn').addEventListener('click',exportJSON);$('#printBtn').addEventListener('click',()=>window.print());$('#importBtn').addEventListener('click',()=>$('#importFile').click());$('#resetBtn').addEventListener('click',()=>{if(confirm('Discard browser-only edits and return to the generated snapshot?')){local={};localStorage.removeItem(STORAGE_KEY);applyLocal();render();toast('Local edits discarded');}});$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const x=validateImport(JSON.parse(await file.text()));baseData=structuredClone(x);local={};localStorage.removeItem(STORAGE_KEY);applyLocal();render();toast('Imported roadmap snapshot');}catch(err){toast('Import failed: '+err.message);}e.target.value='';});
applyLocal();render();
</script>
</body>
</html>
